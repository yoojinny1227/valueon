<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가치온 통합 관리자 대시보드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background: #0F172A; color: #1E293B; padding: 30px; }
        
        .admin-wrap { max-width: 1200px; margin: 0 auto; }
        
        /* 상단 헤더 */
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: #1E293B; padding: 20px 30px; border-radius: 12px; margin-bottom: 24px; color: white; border: 1px solid #334155; }
        .admin-header h1 { font-size: 20px; font-weight: 800; }
        .admin-header h1 span { color: #38BDF8; }
        .btn-refresh { padding: 8px 16px; background: #0284C7; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-refresh:hover { background: #0369A1; }

        /* 섹션 카드 */
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .section-title { font-size: 18px; font-weight: 800; color: #0F172A; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #F1F5F9; display: flex; justify-content: space-between; align-items: center; }
        
        /* 테이블 스타일 */
        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th, td { border: 1px solid #E2E8F0; padding: 12px; text-align: left; font-size: 13px; }
        th { background: #F8FAFC; font-weight: 700; color: #475569; }
        tr:hover { background-color: #F8FAFC; }

        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
        .badge-new { background: #E0F2FE; color: #0369A1; }
        
        .content-box { background: #F8FAFC; padding: 8px; border-radius: 4px; white-space: pre-wrap; font-size: 12px; color: #334155; border: 1px solid #E2E8F0; max-height: 80px; overflow-y: auto; }
        .no-data { text-align: center; color: #94A3B8; padding: 30px 0; }
    </style>
</head>
<body>

    <div class="admin-wrap">
        <!-- 헤더 -->
        <div class="admin-header">
            <h1>🛡️ 가치온 통합 <span>ADMINISTRATOR</span></h1>
            <button type="button" class="btn-refresh" onclick="loadAllData()">전체 데이터 새로고침 🔄</button>
        </div>

        <!-- [섹션 1] 감정평가 의뢰 목록 관리 -->
        <div class="card">
            <div class="section-title">
                <span>📋 감정평가 의뢰 접수 현황</span>
                <span id="reqCount" style="font-size:14px; color:#64748B;">총 0건</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 12%;">접수번호</th>
                        <th style="width: 12%;">의뢰인 / 연락처</th>
                        <th style="width: 15%;">목적 / 물건종류</th>
                        <th style="width: 22%;">소재지 주소</th>
                        <th style="width: 12%;">추정가액</th>
                        <th style="width: 15%;">진행상태 / 담당자</th>
                        <th style="width: 12%;">접수일시</th>
                    </tr>
                </thead>
                <tbody id="appraisalTableBody">
                    <tr><td colspan="7" class="no-data">데이터를 불러오는 중입니다...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- [섹션 2] 1:1 고객 문의 목록 -->
        <div class="card">
            <div class="section-title">
                <span>💬 1:1 고객 문의 내역</span>
                <span id="qnaCount" style="font-size:14px; color:#64748B;">총 0건</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 15%;">접수 시간</th>
                        <th style="width: 15%;">성함 / 연락처</th>
                        <th style="width: 25%;">문의 제목</th>
                        <th>문의 내용</th>
                    </tr>
                </thead>
                <tbody id="qnaTableBody">
                    <tr><td colspan="4" class="no-data">데이터를 불러오는 중입니다...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 서버에서 감정평가 의뢰 데이터와 고객 문의 데이터를 동시에 가져오기
        async function loadAllData() {
            try {
                // 1. 고객 문의 데이터 로드
                const qnaRes = await fetch('/api/admin/qna-list');
                const qnaData = await qnaRes.json();
                renderQnaList(qnaData.qnaList || []);

                // 2. 감정평가 의뢰 데이터 로드 (서버에 별도 목록 API가 없으면 추가 연동 필요)
                // 현재 등록된 테스트 데이터를 보여주기 위해 임시 연동 혹은 안내
                loadAppraisalList();
            } catch (err) {
                console.error(err);
            }
        }

        function renderQnaList(qnaList) {
            const tbody = document.getElementById('qnaTableBody');
            document.getElementById('qnaCount').innerText = `총 ${qnaList.length}건`;
            tbody.innerHTML = '';

            if (qnaList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-data">접수된 문의 내역이 없습니다.</td></tr>';
                return;
            }

            qnaList.slice().reverse().forEach(qna => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-size:12px; color:#64748B;">${qna.createdAt}</td>
                    <td><strong>${qna.writerName}</strong><br><span style="color:#64748B; font-size:11px;">${qna.writerPhone}</span></td>
                    <td><strong>${qna.title}</strong></td>
                    <td><div class="content-box">${qna.content}</div></td>
                `;
                tbody.appendChild(row);
            });
        }

        async function loadAppraisalList() {
            // 감정평가 의뢰 목록을 관리자에서 볼 수 있도록 서버 API 추가 가능
            const tbody = document.getElementById('appraisalTableBody');
            // 서버에 감정평가 목록 조회 API가 아직 없다면 추후 연동 확장 가능
            tbody.innerHTML = '<tr><td colspan="7" class="no-data">접수된 감정평가 의뢰가 없습니다. (메인에서 의뢰를 접수해 보세요)</td></tr>';
        }

        loadAllData();
    </script>
</body>
</html>
